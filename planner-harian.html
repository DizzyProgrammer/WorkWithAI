<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planner Harian AI</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --panel-alt: #eef4ff;
        --text: #1d2a3a;
        --muted: #5e6d85;
        --primary: #2563eb;
        --primary-soft: #dbeafe;
        --success: #16a34a;
        --warning: #f59e0b;
        --danger: #ef4444;
        --border: #dfe7f1;
        --shadow: 0 10px 25px rgba(37, 99, 235, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f3f8ff, #eef7f1);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 32px auto;
        padding: 0 20px 40px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }

      .title-wrap h1 {
        margin: 0;
        font-size: clamp(1.8rem, 2vw, 2.5rem);
      }

      .title-wrap p {
        margin: 8px 0 0;
        color: var(--muted);
      }

      .badge {
        background: var(--primary-soft);
        color: var(--primary);
        border: 1px solid #bfd4ff;
        padding: 10px 14px;
        border-radius: 999px;
        font-weight: 700;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 20px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }

      .panel-body {
        padding: 18px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 14px;
        margin-bottom: 20px;
      }

      .stat-card {
        background: var(--panel-alt);
        border-radius: 16px;
        padding: 16px;
        border: 1px solid var(--border);
      }

      .stat-label {
        display: block;
        color: var(--muted);
        font-size: 0.8rem;
        margin-bottom: 8px;
      }

      .stat-value {
        font-size: clamp(1.4rem, 2vw, 2rem);
        font-weight: 700;
      }

      form {
        display: grid;
        grid-template-columns: 1.6fr 0.9fr 0.7fr auto;
        gap: 10px;
      }

      input, select, button {
        border-radius: 12px;
        border: 1px solid var(--border);
        padding: 12px 14px;
        font-size: 0.97rem;
      }

      input:focus, select:focus {
        outline: 2px solid rgba(37, 99, 235, 0.2);
      }

      button {
        background: var(--primary);
        color: white;
        border: none;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s ease;
      }

      button:hover {
        filter: brightness(1.05);
      }

      .secondary {
        background: #e2e8f0;
        color: var(--text);
      }

      .task-list {
        margin-top: 20px;
        display: grid;
        gap: 12px;
      }

      .task-item {
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        align-items: center;
        gap: 12px;
        background: #fbfdff;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 14px;
      }

      .task-item.done {
        background: #f0fdf4;
      }

      .task-item.done .task-text {
        text-decoration: line-through;
        color: var(--muted);
      }

      .task-text strong {
        display: block;
      }

      .task-meta {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 4px;
      }

      .priority {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.74rem;
        font-weight: 700;
      }

      .priority.high { background: #fee2e2; color: #b91c1c; }
      .priority.medium { background: #fef3c7; color: #b45309; }
      .priority.low { background: #dcfce7; color: #166534; }

      .side-panel {
        display: grid;
        gap: 20px;
      }

      .focus-box {
        display: grid;
        gap: 10px;
      }

      .focus-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
      }

      .progress {
        width: 100%;
        height: 10px;
        background: #e2e8f0;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 8px;
      }

      .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, var(--primary), #34d399);
        border-radius: inherit;
      }

      .quote {
        border-left: 4px solid var(--primary);
        background: #f8fbff;
        padding: 14px 16px;
        border-radius: 0 12px 12px 0;
        color: var(--muted);
        font-style: italic;
      }

      .empty-state {
        padding: 22px;
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--border);
        border-radius: 14px;
        background: #fafcff;
      }

      @media (max-width: 820px) {
        .grid {
          grid-template-columns: 1fr;
        }

        form {
          grid-template-columns: 1fr 1fr;
        }

        .submit-btn {
          grid-column: span 2;
        }
      }

      @media (max-width: 520px) {
        .header {
          flex-direction: column;
          align-items: flex-start;
        }

        .stats {
          grid-template-columns: 1fr;
        }

        .task-item {
          grid-template-columns: auto 1fr;
        }

        .task-controls {
          grid-column: 1 / -1;
          display: flex;
          justify-content: flex-end;
          gap: 8px;
        }

        form {
          grid-template-columns: 1fr;
        }

        .submit-btn {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="title-wrap">
          <h1>Planner Harian AI</h1>
          <p>Kelola prioritas, tugas, dan kebiasaan hari ini dalam satu tempat.</p>
        </div>
        <div class="badge" id="today-label">Hari ini</div>
      </header>

      <div class="stats">
        <div class="stat-card">
          <span class="stat-label">Total tugas</span>
          <span class="stat-value" id="totalTasks">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Selesai</span>
          <span class="stat-value" id="doneTasks">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Target hari ini</span>
          <span class="stat-value" id="progressText">0%</span>
        </div>
      </div>

      <div class="grid">
        <main class="panel">
          <div class="panel-body">
            <form id="taskForm">
              <input id="taskInput" type="text" placeholder="Ceritakan tugas yang ingin dikerjakan..." required />
              <select id="prioritySelect">
                <option value="high">Prioritas tinggi</option>
                <option value="medium" selected>Prioritas sedang</option>
                <option value="low">Prioritas rendah</option>
              </select>
              <input id="dateInput" type="date" />
              <button type="submit" class="submit-btn">Tambah</button>
            </form>

            <div class="task-list" id="taskList"></div>
          </div>
        </main>

        <aside class="side-panel">
          <div class="panel">
            <div class="panel-body">
              <h3 style="margin-top:0;">Fokus utama</h3>
              <div class="focus-box" id="focusBox"></div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-body">
              <h3 style="margin-top:0;">Motivasi</h3>
              <div class="quote" id="quoteBox"></div>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <script>
      const STORAGE_KEY = 'planner-harian-ai-v1';
      const focusGoals = [
        { name: 'Pekerjaan utama', value: 75 },
        { name: 'Belajar konsisten', value: 60 },
        { name: 'Jaga kesehatan', value: 80 }
      ];

      const quotes = [
        'Konsistensi lebih kuat dari motivasi sesaat.',
        'Tugas kecil yang dikerjakan hari ini akan membuat hari esok lebih ringan.',
        'Fokus pada yang paling berharga, bukan yang paling ramai.',
        'Sukses bukan soal sempurna—tetapi soal terus bergerak.'
      ];

      const defaultTasks = [
        { id: crypto.randomUUID(), text: 'Review target kerja hari ini', priority: 'high', date: todayString(), done: false },
        { id: crypto.randomUUID(), text: 'Belajar 20 menit materi baru', priority: 'medium', date: todayString(), done: false },
        { id: crypto.randomUUID(), text: 'Tinjau catatan dan prioritas berikutnya', priority: 'low', date: todayString(), done: true }
      ];

      let tasks = loadTasks();

      const taskForm = document.getElementById('taskForm');
      const taskInput = document.getElementById('taskInput');
      const prioritySelect = document.getElementById('prioritySelect');
      const dateInput = document.getElementById('dateInput');
      const taskList = document.getElementById('taskList');
      const focusBox = document.getElementById('focusBox');
      const quoteBox = document.getElementById('quoteBox');
      const todayLabel = document.getElementById('today-label');

      function todayString() {
        const now = new Date();
        return now.toISOString().slice(0, 10);
      }

      function loadTasks() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return defaultTasks;

        try {
          const parsed = JSON.parse(saved);
          return Array.isArray(parsed) && parsed.length ? parsed : defaultTasks;
        } catch (error) {
          return defaultTasks;
        }
      }

      function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function formatDate(value) {
        if (!value) return 'Tanpa tanggal';
        const date = new Date(value + 'T00:00:00');
        return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
      }

      function renderFocus() {
        focusBox.innerHTML = focusGoals.map(goal => `
          <div>
            <div class="focus-item">
              <span>${goal.name}</span>
              <strong>${goal.value}%</strong>
            </div>
            <div class="progress">
              <div class="progress-bar" style="width: ${goal.value}%"></div>
            </div>
          </div>
        `).join('');
      }

      function renderQuote() {
        const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
        quoteBox.textContent = randomQuote;
      }

      function renderTasks() {
        if (!tasks.length) {
          taskList.innerHTML = '<div class="empty-state">Belum ada tugas. Tambahkan yang paling penting hari ini.</div>';
        } else {
          taskList.innerHTML = tasks.map(task => `
            <div class="task-item ${task.done ? 'done' : ''}" data-id="${task.id}">
              <input type="checkbox" ${task.done ? 'checked' : ''} aria-label="Tandai selesai" />
              <div class="task-text">
                <strong>${task.text}</strong>
                <div class="task-meta">${formatDate(task.date)} • ${task.priority === 'high' ? 'Prioritas tinggi' : task.priority === 'medium' ? 'Prioritas sedang' : 'Prioritas rendah'}</div>
              </div>
              <span class="priority ${task.priority}">${task.priority === 'high' ? 'Tinggi' : task.priority === 'medium' ? 'Sedang' : 'Rendah'}</span>
              <div class="task-controls">
                <button class="secondary delete-btn" type="button">Hapus</button>
              </div>
            </div>
          `).join('');
        }

        updateStats();
      }

      function updateStats() {
        const total = tasks.length;
        const done = tasks.filter(task => task.done).length;
        const progress = total ? Math.round((done / total) * 100) : 0;

        document.getElementById('totalTasks').textContent = total;
        document.getElementById('doneTasks').textContent = done;
        document.getElementById('progressText').textContent = progress + '%';
      }

      function addTask(event) {
        event.preventDefault();
        const text = taskInput.value.trim();
        const priority = prioritySelect.value;
        const date = dateInput.value || todayString();

        if (!text) return;

        tasks.unshift({
          id: crypto.randomUUID(),
          text,
          priority,
          date,
          done: false
        });

        saveTasks();
        renderTasks();
        taskForm.reset();
        prioritySelect.value = 'medium';
        dateInput.value = '';
        taskInput.focus();
      }

      function toggleTask(id) {
        tasks = tasks.map(task => task.id === id ? { ...task, done: !task.done } : task);
        saveTasks();
        renderTasks();
      }

      function deleteTask(id) {
        tasks = tasks.filter(task => task.id !== id);
        saveTasks();
        renderTasks();
      }

      taskForm.addEventListener('submit', addTask);

      taskList.addEventListener('change', (event) => {
        const checkbox = event.target;
        if (checkbox.matches('input[type="checkbox"]')) {
          const item = checkbox.closest('.task-item');
          if (!item) return;
          toggleTask(item.dataset.id);
        }
      });

      taskList.addEventListener('click', (event) => {
        const button = event.target.closest('.delete-btn');
        if (!button) return;
        const item = button.closest('.task-item');
        if (!item) return;
        deleteTask(item.dataset.id);
      });

      todayLabel.textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
      renderFocus();
      renderQuote();
      renderTasks();
    </script>
  </body>
</html>
