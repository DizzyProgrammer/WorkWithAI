<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker Keuangan Pribadi</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --text:#1f2937; --muted:#6b7280; --green:#16a34a; --red:#dc2626; --blue:#2563eb; --border:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  .summary { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap:12px; }
  .summary .label { font-size:.85rem; color:var(--muted); }
  .summary .value { font-size:1.4rem; font-weight:600; margin-top:4px; }
  .income { color:var(--green); } .expense { color:var(--red); } .balance { color:var(--blue); }
  form { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap:10px; align-items:end; }
  label { font-size:.8rem; color:var(--muted); display:flex; flex-direction:column; gap:4px; }
  input, select { padding:8px; border:1px solid var(--border); border-radius:6px; font-size:.95rem; }
  button { padding:9px 14px; border:none; border-radius:6px; background:var(--blue); color:#fff; cursor:pointer; font-size:.9rem; }
  button:hover { opacity:.9; }
  button.secondary { background:#6b7280; }
  button.danger { background:var(--red); padding:4px 8px; font-size:.8rem; }
  .filters { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--border); }
  th { font-size:.8rem; color:var(--muted); font-weight:600; }
  td.amount { text-align:right; white-space:nowrap; }
  .empty { color:var(--muted); text-align:center; padding:20px; }
  .cat-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--border); font-size:.92rem; }
  .bar { height:6px; background:var(--red); border-radius:3px; margin-top:4px; }
  @media (max-width: 560px) { th:nth-child(4), td:nth-child(4) { display:none; } }
</style>
</head>
<body>
<div class="container">
  <h1>Tracker Keuangan Pribadi</h1>

  <div class="card">
    <div class="summary">
      <div><div class="label">Total Pemasukan</div><div class="value income" id="totalIncome">Rp 0</div></div>
      <div><div class="label">Total Pengeluaran</div><div class="value expense" id="totalExpense">Rp 0</div></div>
      <div><div class="label">Saldo</div><div class="value balance" id="balance">Rp 0</div></div>
    </div>
  </div>

  <div class="card">
    <h2>Tambah Transaksi</h2>
    <form id="txForm">
      <label>Tanggal <input type="date" id="date" required></label>
      <label>Tipe
        <select id="type">
          <option value="expense">Pengeluaran</option>
          <option value="income">Pemasukan</option>
        </select>
      </label>
      <label>Kategori
        <select id="category"></select>
      </label>
      <label>Jumlah (Rp) <input type="number" id="amount" min="1" step="1" required></label>
      <label>Catatan <input type="text" id="note" maxlength="100"></label>
      <button type="submit">Simpan</button>
    </form>
  </div>

  <div class="card">
    <h2>Pengeluaran per Kategori (bulan terpilih)</h2>
    <div id="categoryBreakdown"></div>
  </div>

  <div class="card">
    <div class="filters">
      <h2 style="margin:0; flex:1;">Riwayat Transaksi</h2>
      <input type="month" id="monthFilter">
      <select id="typeFilter">
        <option value="all">Semua</option>
        <option value="income">Pemasukan</option>
        <option value="expense">Pengeluaran</option>
      </select>
      <button class="secondary" id="exportBtn">Ekspor CSV</button>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Tanggal</th><th>Tipe</th><th>Kategori</th><th>Catatan</th><th style="text-align:right">Jumlah</th><th></th></tr></thead>
        <tbody id="txBody"></tbody>
      </table>
    </div>
    <div id="emptyMsg" class="empty" style="display:none;">Belum ada transaksi.</div>
  </div>
</div>

<script>
const STORAGE_KEY = "finance-tracker-v1";
const CATEGORIES = {
  expense: ["Makanan", "Transportasi", "Tagihan", "Belanja", "Hiburan", "Kesehatan", "Pendidikan", "Lainnya"],
  income: ["Gaji", "Bonus", "Investasi", "Hadiah", "Lainnya"]
};

let transactions = load();

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error("Gagal memuat data:", e);
    return [];
  }
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
  } catch (e) {
    alert("Gagal menyimpan data. Penyimpanan browser mungkin penuh atau dinonaktifkan.");
  }
}

function formatRp(n) {
  return "Rp " + Math.round(n).toLocaleString("id-ID");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function refreshCategoryOptions() {
  const type = document.getElementById("type").value;
  const sel = document.getElementById("category");
  sel.innerHTML = CATEGORIES[type].map(c => `<option value="${c}">${c}</option>`).join("");
}

function filteredTransactions() {
  const month = document.getElementById("monthFilter").value;
  const type = document.getElementById("typeFilter").value;
  return transactions
    .filter(t => !month || t.date.startsWith(month))
    .filter(t => type === "all" || t.type === type)
    .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
}

function render() {
  // Ringkasan total dihitung dari semua transaksi (tidak terpengaruh filter)
  let income = 0, expense = 0;
  for (const t of transactions) {
    if (t.type === "income") income += t.amount; else expense += t.amount;
  }
  document.getElementById("totalIncome").textContent = formatRp(income);
  document.getElementById("totalExpense").textContent = formatRp(expense);
  document.getElementById("balance").textContent = formatRp(income - expense);

  // Tabel riwayat
  const rows = filteredTransactions();
  const body = document.getElementById("txBody");
  body.innerHTML = rows.map(t => `
    <tr>
      <td>${escapeHtml(t.date)}</td>
      <td>${t.type === "income" ? "Pemasukan" : "Pengeluaran"}</td>
      <td>${escapeHtml(t.category)}</td>
      <td>${escapeHtml(t.note || "-")}</td>
      <td class="amount ${t.type}">${t.type === "income" ? "+" : "-"}${formatRp(t.amount)}</td>
      <td><button class="danger" onclick="removeTx(${t.id})">Hapus</button></td>
    </tr>`).join("");
  document.getElementById("emptyMsg").style.display = rows.length ? "none" : "block";

  renderBreakdown();
}

function renderBreakdown() {
  const month = document.getElementById("monthFilter").value;
  const totals = {};
  let total = 0;
  for (const t of transactions) {
    if (t.type !== "expense") continue;
    if (month && !t.date.startsWith(month)) continue;
    totals[t.category] = (totals[t.category] || 0) + t.amount;
    total += t.amount;
  }
  const entries = Object.entries(totals).sort((a, b) => b[1] - a[1]);
  const container = document.getElementById("categoryBreakdown");
  if (!entries.length) {
    container.innerHTML = '<div class="empty">Tidak ada pengeluaran.</div>';
    return;
  }
  container.innerHTML = entries.map(([cat, amt]) => {
    const pct = total ? (amt / total) * 100 : 0;
    return `<div class="cat-row"><span>${escapeHtml(cat)}</span><span>${formatRp(amt)} (${pct.toFixed(1)}%)</span></div>
            <div class="bar" style="width:${pct}%"></div>`;
  }).join("");
}

function removeTx(id) {
  if (!confirm("Hapus transaksi ini?")) return;
  transactions = transactions.filter(t => t.id !== id);
  save();
  render();
}

document.getElementById("txForm").addEventListener("submit", e => {
  e.preventDefault();
  const amount = Math.round(Number(document.getElementById("amount").value));
  if (!Number.isFinite(amount) || amount <= 0) {
    alert("Jumlah harus lebih dari 0.");
    return;
  }
  transactions.push({
    id: Date.now(),
    date: document.getElementById("date").value,
    type: document.getElementById("type").value,
    category: document.getElementById("category").value,
    amount,
    note: document.getElementById("note").value.trim()
  });
  save();
  e.target.reset();
  document.getElementById("date").value = new Date().toISOString().slice(0, 10);
  refreshCategoryOptions();
  render();
});

document.getElementById("type").addEventListener("change", refreshCategoryOptions);
document.getElementById("monthFilter").addEventListener("change", render);
document.getElementById("typeFilter").addEventListener("change", render);

document.getElementById("exportBtn").addEventListener("click", () => {
  const rows = filteredTransactions();
  if (!rows.length) { alert("Tidak ada data untuk diekspor."); return; }
  const header = ["Tanggal", "Tipe", "Kategori", "Catatan", "Jumlah"];
  const lines = rows.map(t => [
    t.date,
    t.type === "income" ? "Pemasukan" : "Pengeluaran",
    t.category,
    `"${(t.note || "").replace(/"/g, '""')}"`,
    t.amount
  ].join(","));
  const csv = "\uFEFF" + [header.join(","), ...lines].join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `transaksi-${document.getElementById("monthFilter").value || "semua"}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

// Inisialisasi
document.getElementById("date").value = new Date().toISOString().slice(0, 10);
refreshCategoryOptions();
render();
</script>
</body>
</html>
